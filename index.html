<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hospital Facilities Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    h2 { text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Hospital Facilities Map</h2>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    // Initialize map
    var map = L.map('map').setView([33.7, 73.05], 10);

    // Add OSM tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load GeoJSON from GitHub raw URL
    fetch('RAW_GITHUB_URL_HERE') // <-- Replace this with your raw GitHub URL
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            const props = feature.properties;
            // Bind detailed popup
            layer.bindPopup(`
              <b>${props.name || "No name"}</b><br>
              Type: ${props.type || "Not available"}<br>
              Ownership: ${props.ownership || "Not available"}<br>
              Beds: ${props.beds || "Not available"}<br>
              Address: ${props.address || "Not available"}
            `);
          }
        }).addTo(map);
      })
      .catch(err => {
        console.error("Failed to load GeoJSON:", err);
      });

    // Add search/geocoder
    L.Control.geocoder().addTo(map);
  </script>
</body>
</html>
