<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hospital Facilities Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet Search CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Hospital Facilities Map</h2>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Geocoder plugin -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    // Initialize map
    var map = L.map('map').setView([33.7, 73.05], 7);

    // Add OSM tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load hospitals.geojson (file is in root, not in data folder)
    fetch('hospitals.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            layer.bindPopup(
              `<b>${feature.properties.name}</b><br>` +
              `${feature.properties.type}<br>` +
              `Beds: ${feature.properties.beds}<br>` +
              `${feature.properties.address}`
            );
          }
        }).addTo(map);
      });

    // Add search/geocoder
    L.Control.geocoder().addTo(map);
  </script>
</body>
</html>
