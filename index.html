<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hospital Facilities Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    h2 { text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Hospital Facilities Map</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    var map = L.map('map').setView([33.7, 73.05], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load GeoJSON
    fetch('hospitals.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function(feature, layer) {
            const p = feature.properties;

            // Bind popup with relevant details
            layer.bindPopup(`
              <b>${p.name || "No name"}</b><br>
              Type: ${p.type || "Not available"}<br>
              Ownership: ${p.ownership || "Not available"}<br>
              Beds: ${p.beds || "Not available"}<br>
              Address: ${p.address || "Not available"}<br>
              Speciality: ${p["healthcare:speciality"] || "Not available"}<br>
              Wikipedia: <a href="https://en.wikipedia.org/wiki/${p.name}" target="_blank">Link</a>
            `);
          }
        }).addTo(map);
      })
      .catch(err => console.error("Error loading GeoJSON:", err));

    // Add search/geocoder
    L.Control.geocoder().addTo(map);
  </script>
</body>
</html>
